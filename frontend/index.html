<!doctype html>
<html lang="en" data-mode="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/poultrytrack-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PoultryTrack</title>
    <script>
      try {
        var m = localStorage.getItem('pf-theme')
        if (m === 'dark' || m === 'light') document.documentElement.dataset.mode = m
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
