# Do not use "poultry" — that collides with root docker-compose.yml (local Postgres).
name: poultry-prod

# Dedicated bridge for Caddy→API only. Keep PF_TRUSTED_PROXIES in lockstep with this
# subnet (not all of RFC1918). If "Pool overlaps", pick another /24 and update both.
networks:
  poultry:
    driver: bridge
    ipam:
      config:
        - subnet: 10.201.87.0/24

services:
  db:
    image: postgres:16
    networks:
      poultry:
        aliases: [db]
    environment:
      POSTGRES_USER: poultry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: poultry
    volumes:
      - poultry-pg-data:/var/lib/postgresql/data
      - ../backend/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poultry -d poultry"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    networks:
      poultry:
        aliases: [api]
    environment:
      DATABASE_URL: postgresql+psycopg://poultry:${POSTGRES_PASSWORD}@db:5432/poultry
      PF_SESSION_SECRET: ${PF_SESSION_SECRET:?set PF_SESSION_SECRET in .env}
      PF_HTTPS_ONLY: ${PF_HTTPS_ONLY:-1}
      PF_CORS_ORIGINS: ${PF_CORS_ORIGINS:-}
      PF_TRUSTED_PROXIES: ${PF_TRUSTED_PROXIES:-10.201.87.0/24}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 90s
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.caddy
      args:
        VITE_API_BASE: ""
    networks:
      poultry:
        aliases: [web]
    ports:
      - "80:80"
      - "443:443"
      # Do not set dns: here — it bypasses Docker embedded DNS and breaks
      # reverse_proxy to hostname "api". ACME uses host/Docker forwarders.
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env (domain or :80)}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  poultry-pg-data:
  caddy-data:
  caddy-config:
